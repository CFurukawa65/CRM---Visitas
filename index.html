<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>CRM Visitas · Copasul</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <strong>CRM Visitas</strong>
      <span id="pill-rede" class="pill">online</span>
    </div>
    <div class="topo-linha pequeno">
      <span id="topo-vendedor">—</span>
      <span id="topo-pendentes"></span>
    </div>
  </header>

  <main>
    <section id="view-lista" class="view"></section>
    <section id="view-ficha" class="view" hidden></section>
    <section id="view-visita" class="view" hidden></section>
    <section id="view-historico" class="view" hidden></section>
    <section id="view-config" class="view" hidden></section>
  </main>

  <div id="barra-salvar" class="barra-salvar" hidden>
    <button id="btn-salvar" class="btn grande primario" type="button">Salvar registro</button>
  </div>

  <nav class="abas" id="abas">
    <button type="button" data-aba="negocios" class="ativa">Negócios</button>
    <button type="button" data-aba="historico">Histórico</button>
    <button type="button" data-aba="config">Config</button>
  </nav>

  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
